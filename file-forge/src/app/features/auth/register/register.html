<main class="register">
  <form class="register__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="register__title">Crear cuenta</h1>
    <p class="register__subtitle">Regístrate para empezar a usar el gestor documental</p>

    @if (error()) {
      <div class="register__alert" role="alert">{{ error() }}</div>
    }

    <label class="register__field">
      <span>Nombre</span>
      <input type="text" formControlName="name" autocomplete="name" placeholder="Tu nombre" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small class="register__error">El nombre es obligatorio</small>
      }
    </label>

    <label class="register__field">
      <span>Correo electrónico</span>
      <input type="email" formControlName="email" autocomplete="username" placeholder="correo@empresa.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="register__error">
          @if (form.controls.email.hasError('required')) { El correo es obligatorio }
          @else { Ingresa un correo válido }
        </small>
      }
    </label>

    <label class="register__field">
      <span>Contraseña</span>
      <div class="register__password">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
        />
        <button type="button" (click)="toggleShowPassword()">
          {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="register__error">
          @if (form.controls.password.hasError('required')) { La contraseña es obligatoria }
          @else { La contraseña debe tener al menos 6 caracteres }
        </small>
      }
    </label>

    <label class="register__field">
      <span>Confirmar contraseña</span>
      <input
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="confirm"
        autocomplete="new-password"
      />
      @if (form.controls.confirm.touched && (form.controls.confirm.invalid || form.hasError('passwordMismatch'))) {
        <small class="register__error">Las contraseñas no coinciden</small>
      }
    </label>

    <button class="register__submit" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creando cuenta...' : 'Registrarme' }}
    </button>

    <p class="register__link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</main>
