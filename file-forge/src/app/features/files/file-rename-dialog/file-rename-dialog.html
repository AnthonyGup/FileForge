<app-dialog title="Renombrar archivo" (closed)="cancelled.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Nombre</span>
      <div class="rename__row">
        <input
          type="text"
          formControlName="base"
          maxlength="100"
          autocomplete="off"
          autofocus
          (focus)="$any($event.target).select()"
        />
        <span class="rename__suffix">{{ suffix() }}</span>
      </div>
    </label>

    @if (form.controls.base.touched && form.controls.base.invalid) {
      <small class="field-error">
        @if (form.controls.base.hasError('required') || form.controls.base.hasError('blank')) {
          El nombre es obligatorio
        } @else {
          El nombre no puede contener / ni \
        }
      </small>
    }

    <small class="rename__hint">La extensión no se puede cambiar.</small>

    @if (error()) {
      <div class="form-alert" role="alert">{{ error() }}</div>
    }

    <div class="dialog-actions">
      <button type="button" class="btn" (click)="cancelled.emit()">Cancelar</button>
      <button type="submit" class="btn btn--primary" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-dialog>
