<aside class="sidebar" [class.sidebar--open]="layout.sidebarOpen()">
  <div class="sidebar__inner">
    <nav>
      @for (item of visibleItems(); track item.route) {
        <a
          class="sidebar__link"
          [routerLink]="item.route"
          routerLinkActive="sidebar__link--active"
        >
          <span class="sidebar__icon"><app-ui-icon [name]="item.icon" /></span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <button type="button" class="sidebar__logout" (click)="auth.logout()">
        <span class="sidebar__icon"><app-ui-icon name="logout" /></span>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </div>
</aside>
