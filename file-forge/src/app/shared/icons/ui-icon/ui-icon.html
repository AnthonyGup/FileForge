<svg
  class="ui-icon"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  [class.ui-icon--spin]="name() === 'loading'"
>
  @for (d of paths(); track $index) {
    <path [attr.d]="d" />
  }
</svg>
